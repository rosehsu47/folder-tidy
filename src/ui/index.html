<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整理</title>
<!--
  folder-tidy local web UI (T-003). Embedded in the binary and served by
  `folder-tidy serve` on 127.0.0.1 only. Design reference: docs/mockup/index.html.
  No external requests: fonts fall back to locally installed ones.
-->
<style>
:root{
  --ink:#1C1D1F;--muted:#5F6368;--muted2:#44474C;--line:#E2E2DD;--line2:#ECECE8;--line3:#F2F2EF;
  --ground:#F4F4F1;--panel:#FBFBF9;--white:#FFFFFF;--blue:#2560D6;--blue-d:#1A47A3;--blue-soft:#E8F0FE;
  --red:#A82D57;--red-soft:#FBE8EF;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans TC','PingFang TC',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
h1{margin:0 0 6px;font-size:26px;font-weight:700}
h2{margin:0}
p{margin:0}
.sub{font-size:14px;color:var(--muted)}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 200px;max-width:100%;padding:24px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 20px;font-size:17px;font-weight:700}
.navbtn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:8px;font-size:14px;text-align:left;background:transparent;cursor:pointer;transition:background 120ms}
.navbtn:hover{background:var(--line2)}
.navbtn.on{background:var(--blue-soft);color:var(--blue-d);font-weight:700}
.navbtn:disabled{color:#6B6E73;cursor:default;background:transparent}
.badge{margin-left:auto;font-size:12px;background:var(--blue);color:#fff;border-radius:10px;padding:1px 8px;font-weight:400}
.sep{height:1px;background:var(--line);margin:12px 8px}
main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,4vw,48px) 48px}
.page{max-width:960px;display:flex;flex-direction:column;gap:20px;animation:fadein 160ms ease-out both}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid #D6D6D0;border-radius:10px;background:var(--white);font-size:14px;cursor:pointer;transition:background 120ms,transform 80ms}
.btn:hover{background:var(--line2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--blue);color:#fff;border:0;font-weight:700;padding:0 24px}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{background:var(--red);color:#fff;border:0;font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.icon{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted2)}
.icon:hover{background:rgba(20,20,19,.07)}
.icon.del{color:var(--red)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px;min-height:130px;border-radius:12px;border:2px solid var(--line);background:var(--white);text-align:left;cursor:pointer;transition:border-color 120ms,box-shadow 120ms}
.card:hover{box-shadow:0 2px 10px rgba(20,20,19,.08)}
.card.on{border-color:var(--blue);background:#F5F8FF}
.card:disabled{opacity:.6;cursor:default;box-shadow:none}
.card .ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--line3);color:var(--muted2)}
.card.on .ic{background:var(--blue);color:#fff}
.card .nm{font-size:16px;font-weight:700}
.card .pt{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.card .nt{margin-top:auto;font-size:13px;color:var(--muted2)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line2)}
.bar>div{transition:width 200ms}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.groups{display:flex;flex-direction:column;gap:12px}
.group{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:4px;min-height:52px;padding-right:8px}
.gtoggle{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 8px 0 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.gtoggle .chev{transition:transform 120ms;flex:none}
.gtitle{flex:0 1 auto;max-width:60%;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcount{font-size:13px;color:var(--muted);flex:none}
/* The note (target path) takes only the space left after the name and is
   the one that truncates first, so a long path never hides the name. */
.gnote{flex:1 1 0;min-width:0;text-align:right;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead .gcb{margin-left:16px;flex:none} /* .ghead: .cb below resets margin */
.gcb-gap{width:34px;flex:none}
.gcb + .gtoggle,.gcb-gap + .gtoggle{padding-left:4px}
.gmove{flex:none;max-width:150px;min-height:32px;padding:0 6px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--muted);font-size:13px}
.gedit{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 6px 16px}
.gedit.confirm{background:var(--red-soft)}
.gedit input{flex:1 1 180px;min-width:0;min-height:40px;padding:0 10px;border:2px solid var(--blue);border-radius:8px;font-size:15px;font-weight:700;background:#fff}
.gbody{display:flex;flex-direction:column;border-top:1px solid var(--line2)}
.empty{display:flex;align-items:center;gap:10px;padding:16px;margin:12px 16px;font-size:13px;color:var(--muted);border:2px dashed var(--line);border-radius:10px}
.row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 16px;min-height:56px;border-bottom:1px solid var(--line3);transition:background 100ms}
.row:hover{background:#FAFAF8}
.row .lead{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px}
.cb{width:18px;height:18px;accent-color:var(--blue);flex:none;margin:0;cursor:pointer}
.fname{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta.warn{color:var(--red)}
.dest{min-height:36px;max-width:220px;padding:0 8px;border:1px solid transparent;border-radius:6px;font-family:var(--mono);font-size:12px;font-weight:500;cursor:pointer}
.dest.pending{border-color:#D9B24C}
.tile{position:relative;width:42px;height:42px;flex:none;display:flex;justify-content:center}
.tile .ext{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.02em;overflow:hidden}
.th{width:42px;height:42px;flex:none;border-radius:6px;object-fit:cover;background:var(--line3);border:1px solid var(--line2)}
.namebtn{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:4px;margin:-4px;border-radius:8px;text-align:left;cursor:zoom-in}
.namebtn:hover{background:rgba(37,96,214,.06)}
.namebtn .eye{opacity:0;transition:opacity 100ms;flex:none}
.namebtn:hover .eye,.namebtn:focus-visible .eye{opacity:1}
.backdrop{position:fixed;inset:0;border:0;padding:0;background:rgba(20,20,19,.28);cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:#fff;box-shadow:-8px 0 32px rgba(20,20,19,.16);display:flex;flex-direction:column;animation:slidein 160ms ease-out both}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 12px 16px 24px;border-bottom:1px solid var(--line2)}
.dbody{flex:1 1 auto;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.big{height:300px;flex:none;border-radius:12px;background:var(--line3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.big img{max-width:100%;max-height:100%;object-fit:contain}
.big pre{margin:0;width:100%;height:100%;padding:16px 20px;overflow:auto;background:#fff;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.decide{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line2)}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:13px}
dt{color:var(--muted)}dd{margin:0}
.dfoot{display:flex;gap:8px;padding:12px 24px 20px;border-top:1px solid var(--line2)}
.dfoot .btn{flex:1}
.kbd{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:0 24px 12px}
.stagewrap{overflow-x:auto;border-radius:14px}
.stage{position:relative;width:880px;height:440px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.flyer{position:absolute;width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:fly 700ms cubic-bezier(.45,0,.25,1) both}
.flyer span{max-width:72px;font-size:10px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin{position:absolute;top:316px;height:100px;border-radius:12px;border:2px solid var(--line);background:#FAFAF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 6px;transition:background 150ms,border-color 150ms,transform 150ms}
.bin b{max-width:100%;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin small{font-size:12px;color:var(--muted2)}
.done{position:absolute;left:0;right:0;top:0;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fadein 160ms ease-out both}
.rules{display:flex;flex-wrap:wrap;overflow:hidden}
.rlist{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;padding:12px;border-right:1px solid var(--line2);background:var(--panel)}
.rlist .navbtn.on{background:var(--line2);color:var(--ink)}
.addcat{margin-top:8px;border:1px dashed #C9C9C2;justify-content:flex-start;background:transparent}
.rform{flex:999 1 420px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:500;color:var(--muted2)}
.hint{font-size:12px;color:var(--muted)}
.pathrow{display:flex;gap:8px}
.pathrow .txt{flex:1;min-width:0}
.txt{min-height:44px;padding:0 12px;border:1px solid #D6D6D0;border-radius:8px;font-family:var(--mono);font-size:14px;background:#fff}
.txt.sm{min-height:36px;font-size:13px;padding:0 10px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;padding-left:10px;border-radius:6px;background:var(--line3);font-size:13px}
.chip.mono{font-family:var(--mono)}
.chip.off{color:var(--muted);text-decoration:line-through}
.chip button[data-act="toggleKw"]{width:auto;padding:0 8px;font-size:12px;text-decoration:none}
.chip button{width:28px;height:28px;border:0;border-radius:6px;background:transparent;font-size:15px;cursor:pointer}
.chip button:hover{background:rgba(20,20,19,.08)}
.hist{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px}
.hist .bar{flex:1 1 200px;height:10px}
.alert{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:14px;margin-bottom:16px;max-width:960px}
.alert span{flex:1;white-space:pre-wrap;word-break:break-word}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}55%{transform:translate(calc(var(--dx) * .55),calc(var(--dy) * .55 - 70px)) scale(1.08) rotate(-6deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.still .page,.drawer-open .drawer{animation:none}
@media (prefers-reduced-motion:reduce){.flyer{animation:none;display:none}.page,.done,.drawer{animation:none}.bin,.btn,.bar>div{transition:none}}
</style>
</head>

<script>
'use strict';
var PALETTE = [

  newfolder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M12 10v6M9 13h6"></path>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"></path>',

  plus: '<path d="M12 5v14M5 12h14"></path>',

  right: '<path d="M9 6l6 6-6 6"></path>'
};
function folderIcon(color, w, h) {
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 24 20" aria-hidden="true" style="flex:none"><path d="M1 3a2 2 0 0 1 2-2h5l2 2h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="' + color + '"></path></svg>';

function docIcon(c, w, h) {
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 34 42" aria-hidden="true"><path d="M1.5 1.5h21l10 10v29h-31z" fill="' + c.soft + '" stroke="' + c.color + '" stroke-width="1.5" stroke-linejoin="round"></path><path d="M22.5 1.5v10h10" fill="none" stroke="' + c.color + '" stroke-width="1.5" stroke-linejoin="round"></path></svg>';

var S = {

function api(method, url, body) {
  var opt = { method: method, headers: {} };

    return r.text().then(function (t) {

      try { j = t ? JSON.parse(t) : null; } catch (e) { j = null; }

function allFiles() { var p = plan(); return p ? [].concat.apply([], p.groups.map(function (g) { return g.files; })) : []; }
function filesFor(name) { return allFiles().filter(function (f) { return f.dest === name; }); }
function uniqueName(base, list) { var k = 1; var names = (list || cats()).map(function (c) { return c.name; }); while (names.indexOf(base + ' ' + k) >= 0) k++; return base + ' ' + k; }
// Adds a folder named "<base> N". N is picked from the server's current
// folders, not this page's copy, which can be stale (another tab, or an
// earlier add whose answer has not arrived yet).
function addNamed(base, then) {
  var name;
  run(api('GET', '/api/state').then(function (st) {
    name = uniqueName(base, st.config.category || []);
    return api('POST', '/api/folders', { name: name });
  }), function (j) { setData(j); then(name); });
}
function cloneCfg() { return JSON.parse(JSON.stringify(cfg())); }
function saveCfg(c) { run(api('PUT', '/api/config', c), setData); }
function selCat() { var c = cats(); for (var i = 0; i < c.length; i++) if (c[i].name === S.selCat) return c[i]; return c[0] || null; }

// ---------- preview drawer ----------
// Thumbnails and text excerpts are made locally by the server (Quick Look)
// and only for files of the current scan; nothing is sent anywhere.
var THUMB_KINDS = { image: true, pdf: true, video: true };
function thumbUrl(f, size) {
  return '/api/thumbnail?path=' + encodeURIComponent(f.path) + '&size=' + size + '&v=' + encodeURIComponent(f.size + '-' + f.modified);
}
function fileByPath(p) { var a = allFiles(); for (var i = 0; i < a.length; i++) if (a[i].path === p) return a[i]; return null; }

// List thumbnails load through a small queue instead of plain <img src>:
// a browser opens at most 6 connections per host, and a Quick Look run that
// hangs holds its request until the server's timeout (504). Six of those
// would leave no connection for 確認搬移 or any other API call, so at most
// MAX_THUMB_FETCHES load at once. They load in off-DOM Image objects, which
// survive re-renders; the row shows a placeholder until its image is in the
// browser cache, then a plain <img> of the same URL.
var MAX_THUMB_FETCHES = 4;
var thumbQueue = [], thumbLoading = 0, thumbState = {}; // url -> 'queued' | 'loading' | 'ok'
function queueThumb(f, url) {
  if (thumbState[url]) return;
  thumbState[url] = 'queued';
  thumbQueue.push({ path: f.path, url: url });
  pumpThumbs();
}
function pumpThumbs() {
  while (thumbLoading < MAX_THUMB_FETCHES && thumbQueue.length) loadThumb(thumbQueue.shift());
}
function loadThumb(item) {
  thumbLoading++;
  thumbState[item.url] = 'loading';
  var im = new Image();
  im.onload = function () { thumbDone(item, true); };
  im.onerror = function () { thumbDone(item, false); };
  im.src = item.url;
}
function thumbDone(item, ok) {
  thumbLoading--;
  if (ok) thumbState[item.url] = 'ok';
  else { delete thumbState[item.url]; S.thumbFail[item.path] = true; }
  var slots = app.querySelectorAll('[data-thumbwait]');
  for (var i = 0; i < slots.length; i++) {
    if (slots[i].dataset.thumbwait !== item.path) continue;
    var f = fileByPath(item.path);
    if (f) slots[i].outerHTML = fileTile(f);
  }
  pumpThumbs();
}
// Only rows near the viewport queue their thumbnail: a placeholder is
// observed after every render and queued once it comes within
// THUMB_MARGIN of the screen, so a folder with thousands of photos does not
// ask Quick Look for every one of them up front.
var THUMB_MARGIN = '200px';
var thumbObserver = null;
function observeThumbs() {
  var slots = app.querySelectorAll('[data-thumbwait]');
  if (!('IntersectionObserver' in window)) {
    for (var i = 0; i < slots.length; i++) queueSlot(slots[i]);
    return;
  }
  if (thumbObserver) thumbObserver.disconnect();
  thumbObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      thumbObserver.unobserve(en.target);
      queueSlot(en.target);
    });
  }, { rootMargin: THUMB_MARGIN });
  for (var j = 0; j < slots.length; j++) thumbObserver.observe(slots[j]);
}
function queueSlot(el) {
  var f = fileByPath(el.dataset.thumbwait);
  if (f) queueThumb(f, el.dataset.thumburl);
}
// A new scan drops thumbnails still waiting for the old one.
function clearThumbQueue() {
  thumbQueue.forEach(function (item) { delete thumbState[item.url]; });
  thumbQueue = [];
}
function pvFile() { return S.pv ? fileByPath(S.pv) : null; }
function dropPreview() {
  if (S.pvBig && S.pvBig.url) URL.revokeObjectURL(S.pvBig.url);
  S.pv = null; S.pvBig = null;
}
function closePreview() { S.pvReturn = S.pv; dropPreview(); render(); }
// Keyboard focus stays inside the open drawer (it is aria-modal).
function drawerFocusables() {
  var d = app.querySelector('.drawer'); if (!d) return [];
  return [].filter.call(d.querySelectorAll('button, select, input, textarea, a[href], [tabindex]'), function (el) {
    return !el.disabled && el.tabIndex >= 0;
  });
}
function openPreview(path) {
  dropPreview();
  var f = fileByPath(path); if (!f) { render(); return; }
  S.pv = path; S.pvFocus = true;
  var big = S.pvBig = { path: path, state: 'loading' };
  render();
  var load = f.preview === 'text'
    ? api('GET', '/api/preview/text?path=' + encodeURIComponent(path)).then(function (j) {
        big.state = 'text'; big.lines = j.lines; big.truncated = j.truncated;
      })
    : fetch(thumbUrl(f, 600)).then(function (r) {
        if (r.ok) return r.blob().then(function (b) { big.state = 'image'; big.url = URL.createObjectURL(b); });
        return r.text().then(function (t) {
          var j = null; try { j = JSON.parse(t); } catch (e) { j = null; }
          throw new Error((j && j.error) || ('HTTP ' + r.status + (t ? '：' + t : '')));
        });
      });
  load.catch(function (e) { big.state = 'error'; big.error = e.message; }).then(function () {
    if (S.pvBig === big) render();
    else if (big.url) URL.revokeObjectURL(big.url); // drawer moved on meanwhile
  });
}
function stepPreview(dir) {
  var order = allFiles(); var ix = order.indexOf(pvFile()); var j = ix + dir;
  if (ix >= 0 && j >= 0 && j < order.length) openPreview(order[j].path);
}

// ---------- actions ----------
function go(screen) {
  if (S.stage && S.stage.phase === 'flying') return;
  dropPreview();
  S.screen = screen; S.editing = null; S.confirmDel = null;
  if (screen !== 'stage') S.stage = null;
  if (screen === 'history') { run(api('GET', '/api/history'), function (j) { S.history = j; }); return; }
  render();
}
function commitName() {
  var from = S.editing; if (!from) return;
  var to = S.draftName.trim();
  S.editing = null;
  if (!to || to === from) { S.renameReturn = from; render(); return; }
  S.renameReturn = to;
  run(api('POST', '/api/folders/rename', { from: from, to: to }), function (j) {
    setData(j);
    if (S.created[from]) { delete S.created[from]; S.created[to] = true; }
    if (S.selCat === from) S.selCat = to;
  });
}
function deleteFolder(name) {
  run(api('POST', '/api/folders/delete', { name: name }), function (j) {
    setData(j); delete S.created[name]; S.confirmDel = null;
    if (S.selCat === name) S.selCat = null;
  });
}
function startApply() {
  run(api('POST', '/api/apply', { confirm: true }), function (j) {
    setData(j.state); dropPreview();
    var root = plan() ? plan().root : '';
    var moved = j.report.moved.map(function (m) { return { name: basename(m.to), dest: destCategory(m.to, root) }; });
    S.stage = { moved: moved, collisions: j.report.collisions.length, tick: 0, phase: 'flying' };
    S.screen = 'stage';
    clearInterval(timer);
    if (reducedMotion() || !moved.length) { S.stage.phase = 'done'; return; }
    var last = Math.min(moved.length, MAX_FLYERS) + 12;
    timer = setInterval(function () {
      S.stage.tick++;
      if (S.stage.tick >= last) { clearInterval(timer); timer = null; S.stage.phase = 'done'; render(); }
      else updateBins();
    }, STEP);
  });
}
function undoLast(then) {
  run(api('POST', '/api/undo', {}), function (j) {
    setData(j.state);
    if (j.report.failed.length) S.error = j.report.failed.length + ' 個檔案無法搬回原位（仍留在紀錄中，可以再試一次）：\n' +
      j.report.failed.map(function (f) { return basename(f.from) + '：' + f.reason; }).join('\n');
    if (then) then();
  });
}
function addChip(field, draftKey) {
  var v = S[draftKey].trim(); if (!v) return;
  var c = cloneCfg(); var cat = null;
  if (field === 'ai_exclude') { c.ai_exclude = c.ai_exclude || []; if (c.ai_exclude.indexOf(v) < 0) c.ai_exclude.push(v); }
  else {
    c.category.forEach(function (x) { if (x.name === selCat().name) cat = x; });
    if (field === 'extensions') v = v.replace(/^\./, '').toLowerCase();
    if (cat[field].indexOf(v) < 0) cat[field].push(v);
    // Adding a keyword that is switched off turns it on instead of listing it twice.
    if (field === 'keywords') cat.disabled_keywords = (cat.disabled_keywords || []).filter(function (e) { return e !== v; });
  }
  S[draftKey] = ''; saveCfg(c);
}
function rmChip(field, v) {
  var c = cloneCfg();
  if (field === 'ai_exclude') c.ai_exclude = (c.ai_exclude || []).filter(function (e) { return e !== v; });
  else c.category.forEach(function (x) { if (x.name === selCat().name) x[field] = x[field].filter(function (e) { return e !== v; }); });
  saveCfg(c);
}
// Switch a keyword off (kept in disabled_keywords, never matched) or back on.
function toggleKeyword(v, enable) {
  var c = cloneCfg();
  c.category.forEach(function (x) {
    if (x.name !== selCat().name) return;
    var from = enable ? (x.disabled_keywords || []) : x.keywords;
    var to = enable ? x.keywords : (x.disabled_keywords || []);
    from = from.filter(function (e) { return e !== v; });
    if (to.indexOf(v) < 0) to.push(v);
    x.keywords = enable ? to : from;
    x.disabled_keywords = enable ? from : to;
  });
  saveCfg(c);
}
// Relative date presets (D-006), counted back from the scan date. A rule is
// either relative or absolute (the server rejects both), so picking one
// clears the other.
var DATE_PRESETS = [['', '不限'], ['n7', '一週內'], ['n30', '一個月內'], ['o365', '超過一年']];
function presetValue(d) {
  if (d.newer_than_days != null && d.older_than_days == null) return 'n' + d.newer_than_days;
  if (d.older_than_days != null && d.newer_than_days == null) return 'o' + d.older_than_days;
  return d.newer_than_days != null ? 'custom' : '';
}
function presetOptions(d) {
  var v = presetValue(d), known = DATE_PRESETS.some(function (p) { return p[0] === v; });
  var opts = DATE_PRESETS.map(function (p) { return '<option value="' + p[0] + '"' + (p[0] === v ? ' selected' : '') + '>' + p[1] + '</option>'; });
  // A relative value the presets don't cover (edited in the rules file) is shown, not dropped.
  if (!known) opts.push('<option value="' + esc(v) + '" selected>自訂</option>');
  return opts.join('');
}
function setPreset(value) {
  // '' = 不限; nN / oN = a preset or a single relative value; 'custom'
  // (both relative bounds) is left as it is.
  if (value && !/^[no]\d+$/.test(value)) return;
  var c = cloneCfg();
  c.category.forEach(function (x) {
    if (x.name !== selCat().name) return;
    if (!value) { delete x.date; return; }
    var days = +value.slice(1);
    x.date = value[0] === 'n' ? { newer_than_days: days } : { older_than_days: days };
  });
  saveCfg(c);
}
function setDate(bound, value) {
  var c = cloneCfg();
  c.category.forEach(function (x) {
    if (x.name !== selCat().name) return;
    var d = x.date || {};
    delete d.newer_than_days; delete d.older_than_days;
    if (value) d[bound] = value; else delete d[bound];
    if (d.before || d.after) x.date = d; else delete x.date;
  });
  saveCfg(c);
}

var ACT = {
  nav: function (d) { go(d.to); },
  dismiss: function () { S.error = null; render(); },
  pickSource: function (d) { var s = SOURCES.filter(function (x) { return x.id === d.id; })[0]; S.source = s.id; S.dir = s.path; render(); },
  // The dialog opens on the Mac (the server runs osascript); Cancel keeps the box as is.
  pickDir: function () {
    run(api('POST', '/api/pick-folder', { start: S.dir }), function (j) {
      if (j.path !== null) { S.dir = j.path; S.source = null; }
    });
  },
  // 清除預覽: forget this scan and its choices; no file is touched.
  clearPlan: function () {
    run(api('POST', '/api/clear', {}), function (j) {
      setData(j); dropPreview(); clearThumbQueue(); S.thumbFail = {}; S.created = {}; S.collapsed = {}; S.remembering = null; S.editing = null; S.confirmDel = null; S.screen = 'source';
    });
  },
  scan: function () {
    run(api('POST', '/api/scan', { dir: S.dir, recursive: S.recursive }), function (j) {
      setData(j); dropPreview(); clearThumbQueue(); S.thumbFail = {}; S.created = {}; S.collapsed = {}; S.remembering = null; S.screen = 'preview';
    });
  },
  openPv: function (d) { openPreview(d.path); },
  closePv: function () { closePreview(); },
  pvStep: function (d) { stepPreview(+d.dir); },
  selectAll: function () {
    var paths = allFiles().filter(function (f) { return f.status === 'move' && !f.checked; }).map(function (f) { return f.path; });
    if (paths.length) run(api('POST', '/api/check', { paths: paths, checked: true }), setData);
  },
  apply: function () { startApply(); },
  aiSuggest: function () {
    S.aiBusy = true;
    // finally runs before run()'s own handlers re-render, on success and error alike.
    run(api('POST', '/api/ai/suggest', {}).finally(function () { S.aiBusy = false; }), setData);
  },
  addFolder: function () {
    addNamed('新資料夾', function (name) {
      S.created[name] = true; S.editing = name; S.draftName = name;
    });
  },
  toggleGroup: function (d) { S.collapsed[d.key] = !S.collapsed[d.key]; render(); },
  startEdit: function (d) { S.editing = d.key; S.draftName = d.key; S.confirmDel = null; render(); },
  commitName: function () { commitName(); },
  cancelName: function () { S.renameReturn = S.editing; S.editing = null; render(); },
  startDelete: function (d) {
    if (filesFor(d.key).length === 0) deleteFolder(d.key);
    else { S.confirmDel = d.key; S.editing = null; render(); }
  },
  confirmDelete: function (d) { deleteFolder(d.key); },
  cancelDelete: function () { S.confirmDel = null; render(); },
  undoLast: function () { undoLast(function () { go('history'); }); },
  undo: function () { undoLast(function () { go('history'); }); },
  again: function () { S.stage = null; S.screen = 'source'; render(); },
  pickCat: function (d) { S.selCat = d.id; S.draftExt = ''; S.draftKw = ''; render(); },
  addCat: function () {
    addNamed('新分類', function (name) { S.selCat = name; });
  },
  removeCat: function () { var c = selCat(); if (c) deleteFolder(c.name); },
  addExt: function () { addChip('extensions', 'draftExt'); },
  addKw: function () { addChip('keywords', 'draftKw'); },
  addEx: function () { addChip('ai_exclude', 'draftEx'); },
  rmExt: function (d) { rmChip('extensions', d.v); },
  rmKw: function (d) {
    var c = cloneCfg();
    c.category.forEach(function (x) {
      if (x.name !== selCat().name) return;
      x.keywords = x.keywords.filter(function (e) { return e !== d.v; });
      x.disabled_keywords = (x.disabled_keywords || []).filter(function (e) { return e !== d.v; });
    });
    saveCfg(c);
  },
  toggleKw: function (d) { toggleKeyword(d.v, d.on === '1'); },
  remStart: function (d) {
    var n = basename(d.path), dot = n.lastIndexOf('.');
    S.remembering = d.path; S.draftRem = dot > 0 ? n.slice(0, dot) : n; render();
  },
  remCancel: function () { S.remembering = null; render(); },
  remCommit: function () {
    var path = S.remembering; if (path === null) return;
    run(api('POST', '/api/rules/remember', { path: path, keyword: S.draftRem }), function (j) { setData(j); S.remembering = null; });
  },
  rmEx: function (d) { rmChip('ai_exclude', d.v); }
};

// ---------- views ----------
function navBtn(key, icon, label, extra) {
  var on = S.screen === key || (key === 'preview' && S.screen === 'stage');
  return '<button class="navbtn' + (on ? ' on' : '') + '" data-act="nav" data-to="' + key + '">' + svg(I[icon]) + label + (extra || '') + '</button>';
}
function viewNav() {
  var p = plan();
  return '<nav class="side" aria-label="主選單">' +
    '<div class="brand"><span style="color:var(--blue);display:flex">' + svg(I.logo, 26) + '</span>整理</div>' +
    navBtn('source', 'desktop', '來源') +
    navBtn('preview', 'preview', '預覽', p ? '<span class="badge">' + p.moving + '</span>' : '') +
    navBtn('rules', 'sliders', '分類設定') +
    navBtn('history', 'clock', '紀錄') +
    '<div class="sep"></div>' +
    '<button class="navbtn" disabled>' + svg(I.phone) + 'iPhone<span style="margin-left:auto;font-size:11px">之後提供</span></button>' +
    '</nav>';
}
function viewError() {
  if (!S.error) return '';
  return '<div class="alert" role="alert"><span>' + esc(S.error) + '</span><button class="icon" style="width:28px;height:28px;color:inherit" data-act="dismiss" aria-label="關閉">' + svg(I.close, 14) + '</button></div>';
}
function viewSource() {
  var cards = SOURCES.map(function (x) {
    return '<button class="card' + (x.id === S.source ? ' on' : '') + '" data-act="pickSource" data-id="' + x.id + '"' + (x.disabled ? ' disabled' : '') + '>' +
      '<span class="ic">' + svg(I[x.icon], 22) + '</span>' +
      '<span style="display:flex;flex-direction:column;gap:4px"><span class="nm">' + esc(x.name) + '</span><span class="pt">' + esc(x.path) + '</span></span>' +
      (x.note ? '<span class="nt">' + esc(x.note) + '</span>' : '') + '</button>';
  }).join('');
  return '<section class="page"><div><h1>要整理哪裡？</h1><p class="sub">選一個來源，掃描後會先給你看整理計畫，確認之前不會搬動任何檔案。</p></div>' +
    '<div class="cards">' + cards + '</div>' +
    '<div class="field"><label for="dir">資料夾路徑</label><div class="pathrow"><input id="dir" class="txt" data-input="dir" data-enter="scan" value="' + esc(S.dir) + '" placeholder="/Users/you/Desktop 或 ~/Downloads"><button class="btn" data-act="pickDir"' + (S.busy ? ' disabled' : '') + ' title="用 Mac 的視窗選一個資料夾">選擇…</button></div>' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted2)"><input type="checkbox" class="cb" data-change="recursive"' + (S.recursive ? ' checked' : '') + '>包含子資料夾</label></div>' +
    '<div class="actions" style="align-items:center;gap:16px"><button class="btn primary" data-act="scan"' + (S.busy ? ' disabled' : '') + '>掃描</button><span style="font-size:13px;color:var(--muted)">掃描只讀取檔名與屬性，不會搬動檔案</span></div></section>';
}
function reasonText(f) {
  if (f.source === 'manual') return '手動指定';
  if (f.source === 'rule') return '規則：' + f.reason;
  if (f.source === 'ai') return 'AI：' + f.reason;
  return f.reason;
}
function destSelect(f, c, id, extraStyle) {
  var cur = f.dest === null ? NONE : f.dest;
  var opts = cats().map(function (x) { return '<option value="' + esc(x.name) + '"' + (x.name === cur ? ' selected' : '') + '>' + esc(x.name) + '/</option>'; }).join('') +
    '<option value="' + NONE + '"' + (cur === NONE ? ' selected' : '') + '>不搬（留在原處）</option>';
  return '<select class="dest' + (f.source === 'ai' ? ' pending' : '') + '" data-change="dest" data-path="' + esc(f.path) + '"' + (id ? ' id="' + id + '"' : '') + ' aria-label="' + esc(f.name) + ' 的目的地" title="' + esc(f.to || '不搬') + '" style="background:' + c.soft + ';color:' + c.color + (extraStyle ? ';' + extraStyle : '') + '">' + opts + '</select>';
}
function fileColor(f) { return f.dest === null ? GRAY : colorOf(f.dest); }
// A real Quick Look thumbnail for images, PDFs and videos; a file icon
// otherwise. A thumbnail that failed says so (無縮圖) instead of hiding it.
function fileTile(f) {
  var c = fileColor(f);
  var media = THUMB_KINDS[f.preview];
  if (media && !S.thumbFail[f.path]) {
    var url = thumbUrl(f, 96);
    if (thumbState[url] === 'ok') return '<img class="th" src="' + esc(url) + '" alt="" data-thumb="' + esc(f.path) + '">';
    return '<span class="th" aria-hidden="true" data-thumbwait="' + esc(f.path) + '" data-thumburl="' + esc(url) + '"></span>';
  }
  var ext = f.name.indexOf('.') > 0 ? f.name.slice(f.name.lastIndexOf('.') + 1).toUpperCase().slice(0, 4) : '?';
  return '<span class="tile"' + (media ? ' title="無法產生縮圖"' : '') + '>' + docIcon(c, 34, 42) + '<span class="ext" style="color:' + c.color + '">' + esc(media ? '無縮圖' : ext) + '</span></span>';
}
function fileRow(f) {
  var c = fileColor(f);
  var check = f.dest !== null
    ? '<input type="checkbox" class="cb" data-change="check" data-path="' + esc(f.path) + '"' + (f.checked ? ' checked' : '') + (f.status === 'move' ? '' : ' disabled') + ' aria-label="搬移 ' + esc(f.name) + '">'
    : '<span style="width:18px;flex:none"></span>';
  var meta = f.status === 'collision'
    ? '<span class="fmeta warn">不會搬：' + esc(f.problem) + '（不會覆蓋）</span>'
    : f.status === 'in_place' ? '<span class="fmeta">已經在這個資料夾裡</span>'
    : '<span class="fmeta">' + esc(fmtSize(f.size)) + ' · ' + esc(f.modified) + ' · ' + esc(reasonText(f)) + '</span>';
  return '<div class="row"><span class="lead">' + check +
    '<button class="namebtn" data-act="openPv" data-path="' + esc(f.path) + '" title="預覽">' + fileTile(f) +

    '<button class="icon" data-act="closePv" data-pvclose aria-label="關閉">' + svg(I.close, 18, ' stroke-width="2"') + '</button></div>' +
    '<div class="dbody"><div class="big">' + bigPreview(f) + '</div>' +
    '<div class="decide"><label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer"><input type="checkbox" class="cb" data-change="check" data-path="' + esc(f.path) + '"' + (f.checked ? ' checked' : '') + (canMove ? '' : ' disabled') + '>搬移這個檔案</label>' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><label for="pvdest" style="font-size:13px;color:var(--muted2)">目的地</label>' + destSelect(f, c, 'pvdest', 'flex:1 1 180px;max-width:none;min-height:40px') + '</div>' + target + '</div>' +
    '<dl><dt>大小</dt><dd>' + esc(fmtSize(f.size)) + '</dd><dt>修改日期</dt><dd>' + esc(f.modified) + '</dd>' +
    '<dt>原始位置</dt><dd style="font-family:var(--mono);font-size:12px;word-break:break-all">' + esc(f.path) + '</dd><dt>判斷依據</dt><dd>' + esc(reasonText(f)) + '</dd></dl></div>' +
    '<div class="dfoot"><button class="btn" data-act="pvStep" data-dir="-1"' + (ix <= 0 ? ' disabled' : '') + '>' + svg(I.left, 16, ' stroke-width="2"') + '上一個</button>' +
    '<button class="btn" data-act="pvStep" data-dir="1"' + (ix >= order.length - 1 ? ' disabled' : '') + '>下一個' + svg(I.right, 16, ' stroke-width="2"') + '</button></div>' +
    '<div class="kbd">← → 切換 · Esc 關閉</div></aside>';
}

var VIEWS = { source: viewSource, preview: viewPreview, stage: viewStage, rules: viewRules, history: viewHistory };
var app = document.getElementById('app');
// Position of the focused control among all the drawer's controls (disabled
// ones included, so the position is stable), or -1. render() replaces the
// whole DOM, so without this a re-render while the drawer is open (its large
// preview arriving, a checkbox or destination change) dropped focus to <body>.
var DRAWER_CONTROLS = 'button, select, input, textarea, a[href], [tabindex]';
function drawerFocusIndex() {
  var d = app.querySelector('.drawer');
  if (!d || !d.contains(document.activeElement)) return -1;
  return [].indexOf.call(d.querySelectorAll(DRAWER_CONTROLS), document.activeElement);
}
// render() rebuilds the whole page, which restarted the screen fade-in and
// the drawer slide-in on every click. They now play only on entering a
// screen and on opening the drawer. A re-render in the middle of one (e.g.
// a cached preview arriving 20 ms after the drawer opens) continues it on
// the new element instead of restarting or cutting it.
var lastScreen = null;
// 'done' (no animation running), the running animation's elapsed ms, or
// null (the element is not there).
function animState(sel) {
  var el = app.querySelector(sel); if (!el) return null;
  var a = el.getAnimations ? el.getAnimations()[0] : null;
  return a && a.playState === 'running' ? a.currentTime : 'done';
}
function continueAnim(sel, t) {
  var el = app.querySelector(sel);
  if (el && typeof t === 'number') el.style.animationDelay = (-t) + 'ms';
}
function render() {
  var keep = drawerFocusIndex();
  var pageAnim = S.screen === lastScreen ? animState('.page') : null;
  var drawerAnim = animState('.drawer');
  lastScreen = S.screen;
  var still = (pageAnim === 'done' ? ' still' : '') + (drawerAnim === 'done' ? ' drawer-open' : '');
  app.innerHTML = '<div class="shell' + still + '">' + viewNav() + '<main>' + viewError() + VIEWS[S.screen]() + '</main>' + viewDrawer() + '</div>';
  observeThumbs();
  [].forEach.call(app.querySelectorAll('[data-indet]'), function (el) { el.indeterminate = true; });
  continueAnim('.page', pageAnim);
  continueAnim('.drawer', drawerAnim);
  var af = app.querySelector('[data-autofocus]');
  if (af) { af.focus(); af.select(); }
  if (S.pvFocus) { S.pvFocus = false; var cl = app.querySelector('[data-pvclose]'); if (cl) cl.focus(); }
  else if (keep >= 0 && !af) {
    var d = app.querySelector('.drawer');
    var els = d ? d.querySelectorAll(DRAWER_CONTROLS) : [];
    var el = els[Math.min(keep, els.length - 1)];
    if (el && !el.disabled) el.focus();
    else { var fs = drawerFocusables(); if (fs.length) fs[0].focus(); }
  }
  if (S.renameReturn !== null) {
    var rb = [].filter.call(app.querySelectorAll('[data-act="startEdit"]'), function (b) { return b.dataset.key === S.renameReturn; })[0];
    if (rb) { rb.focus(); S.renameReturn = null; }
    else if (!S.busy) S.renameReturn = null; // the folder is gone; nothing to return to
  }
  if (S.pvReturn !== null) {
    var back = S.pvReturn; S.pvReturn = null;
    // Back to the row that was last shown, if it is still in the list.
    var rows = app.querySelectorAll('.namebtn[data-act="openPv"]');
    for (var i = 0; i < rows.length; i++) if (rows[i].dataset.path === back) { rows[i].focus(); break; }
  }
}

// ---------- events (delegated) ----------
app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var fn = ACT[t.dataset.act]; if (fn) fn(t.dataset, e);
});
app.addEventListener('change', function (e) {
  var t = e.target; var k = t.dataset.change; if (!k) return;
  if (k === 'check') run(api('POST', '/api/check', { paths: [t.dataset.path], checked: t.checked }), setData);
  else if (k === 'dest') run(api('POST', '/api/assign', { path: t.dataset.path, folder: t.value === NONE ? null : t.value }), setData);
  else if (k === 'recursive') S.recursive = t.checked;
  else if (k === 'after' || k === 'before') setDate(k, t.value);
  else if (k === 'datePreset') setPreset(t.value);
  else if (k === 'checkGroup') run(api('POST', '/api/check', { paths: movable(groupFiles(t.dataset.key)).map(function (f) { return f.path; }), checked: t.checked }), setData);
  else if (k === 'moveGroup' && t.value) run(api('POST', '/api/assign-all', { paths: groupFiles(t.dataset.key).map(function (f) { return f.path; }), folder: t.value === NONE ? null : t.value }), setData);
  else if (k === 'catname') { S.editing = selCat().name; S.draftName = t.value; commitName(); }
});
app.addEventListener('input', function (e) { var k = e.target.dataset.input; if (k) S[k] = e.target.value; });
// A list thumbnail Quick Look could not make: show 無縮圖 (error events do
// not bubble, so listen in the capture phase).
app.addEventListener('error', function (e) {
  var t = e.target; if (!t || t.tagName !== 'IMG' || !t.dataset.thumb) return;
  S.thumbFail[t.dataset.thumb] = true;
  var f = fileByPath(t.dataset.thumb); if (f) t.outerHTML = fileTile(f);
}, true);
document.addEventListener('keydown', function (e) {
  var t = e.target;
  // Preview drawer: Tab / Shift+Tab wrap around inside it (aria-modal);
  // focus that is somehow behind the backdrop is pulled back in.
  if (e.key === 'Tab' && S.screen === 'preview' && pvFile()) {
    var fs = drawerFocusables();
    if (fs.length) {
      var first = fs[0], last = fs[fs.length - 1];
      var inside = fs.indexOf(document.activeElement) >= 0;
      if (!inside) { e.preventDefault(); (e.shiftKey ? last : first).focus(); return; }
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); return; }
      if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); return; }
    }
  }
  // Preview drawer: Esc closes, ← → switch (not while choosing in a dropdown).
  if (S.screen === 'preview' && pvFile() && !(t.dataset && t.dataset.enter)) {
    if (e.key === 'Escape') { e.preventDefault(); closePreview(); return; }
    var choosing = t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'checkbox');
    if (!choosing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); stepPreview(e.key === 'ArrowLeft' ? -1 : 1); return; }
  }
  // Only inputs carry data-enter; buttons keep their native Enter = click.
  var act = t.dataset && t.dataset.enter;
  if (!act) return;
  if (act === 'rename') {
    if (e.key === 'Enter') { e.preventDefault(); commitName(); }
    else if (e.key === 'Escape') { e.preventDefault(); S.renameReturn = S.editing; S.editing = null; render(); }
  } else if (act === 'remCommit' && e.key === 'Escape') {
    e.preventDefault(); S.remembering = null; render();
  } else if (e.key === 'Enter' && ACT[act]) { e.preventDefault(); ACT[act](t.dataset); }
});

render();
run(api('GET', '/api/state'), setData);
</script>
</body>
</html>
