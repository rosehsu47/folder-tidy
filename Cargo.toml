[package]
name = "folder-tidy"
version = "0.1.0"
edition = "2024"
description = "Organize a Mac folder (Desktop, Downloads, iCloud Drive) into category folders by rules, with a preview, a local web UI and undo"
license = "MIT"
readme = "README.md"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.2.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
