<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1D1F;--muted:#5F6368;--muted2:#44474C;--line:#E2E2DD;--line2:#ECECE8;--line3:#F2F2EF;
  --ground:#F4F4F1;--panel:#FBFBF9;--white:#FFFFFF;--blue:#2560D6;--blue-d:#1A47A3;--blue-soft:#E8F0FE;
  --red:#A82D57;--red-soft:#FBE8EF;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
h1{margin:0 0 6px;font-size:26px;font-weight:700}
h2{margin:0}
p{margin:0}
.sub{font-size:14px;color:var(--muted)}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 200px;max-width:100%;padding:24px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 20px;font-size:17px;font-weight:700}
.tag{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);border:1px solid #D6D6D0;border-radius:4px;padding:1px 6px}
.navbtn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:8px;font-size:14px;text-align:left;background:transparent;cursor:pointer;transition:background 120ms}
.navbtn:hover{background:var(--line2)}
.navbtn.on{background:var(--blue-soft);color:var(--blue-d);font-weight:700}
.navbtn:disabled{color:#6B6E73;cursor:default;background:transparent}
.badge{margin-left:auto;font-size:12px;background:var(--blue);color:#fff;border-radius:10px;padding:1px 8px;font-weight:400}
.sep{height:1px;background:var(--line);margin:12px 8px}
main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,4vw,48px) 48px}
.page{max-width:960px;display:flex;flex-direction:column;gap:20px;animation:fadein 160ms ease-out both}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid #D6D6D0;border-radius:10px;background:var(--white);font-size:14px;cursor:pointer;transition:background 120ms,transform 80ms}
.btn:hover{background:var(--line2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--blue);color:#fff;border:0;font-weight:700;padding:0 24px}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{background:var(--red);color:#fff;border:0;font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.icon{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted2)}
.icon:hover{background:rgba(20,20,19,.07)}
.icon.del{color:var(--red)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px;min-height:150px;border-radius:12px;border:2px solid var(--line);background:var(--white);text-align:left;cursor:pointer;transition:border-color 120ms,box-shadow 120ms}
.card:hover{box-shadow:0 2px 10px rgba(20,20,19,.08)}
.card.on{border-color:var(--blue);background:#F5F8FF}
.card:disabled{opacity:.6;cursor:default;box-shadow:none}
.card .ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--line3);color:var(--muted2)}
.card.on .ic{background:var(--blue);color:#fff}
.card .nm{font-size:16px;font-weight:700}
.card .pt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card .nt{margin-top:auto;font-size:13px;color:var(--muted2)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line2)}
.bar>div{transition:width 200ms}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.groups{display:flex;flex-direction:column;gap:12px}
.group{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:4px;min-height:52px;padding-right:8px}
.gtoggle{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 8px 0 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.gtoggle .chev{transition:transform 120ms;flex:none}
.gtitle{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcount{font-size:13px;color:var(--muted);flex:none}
.gnote{margin-left:auto;font-size:13px;white-space:nowrap}
.gedit{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 6px 16px}
.gedit.confirm{background:var(--red-soft)}
.gedit input{flex:1 1 180px;min-width:0;min-height:40px;padding:0 10px;border:2px solid var(--blue);border-radius:8px;font-size:15px;font-weight:700;background:#fff}
.gbody{display:flex;flex-direction:column;border-top:1px solid var(--line2)}
.empty{display:flex;align-items:center;gap:10px;padding:16px;margin:12px 16px;font-size:13px;color:var(--muted);border:2px dashed var(--line);border-radius:10px}
.row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 16px;min-height:56px;border-bottom:1px solid var(--line3);transition:background 100ms}
.row:hover{background:#FAFAF8}
.row .lead{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px}
.cb{width:18px;height:18px;accent-color:var(--blue);flex:none;margin:0;cursor:pointer}
.namebtn{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:4px;margin:-4px;border-radius:8px;text-align:left;cursor:zoom-in}
.namebtn:hover{background:rgba(37,96,214,.06)}
.namebtn .eye{opacity:0;transition:opacity 100ms;flex:none}
.namebtn:hover .eye,.namebtn:focus-visible .eye{opacity:1}
.fname{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest{min-height:36px;max-width:200px;padding:0 8px;border:1px solid transparent;border-radius:6px;font-family:var(--mono);font-size:12px;font-weight:500;cursor:pointer}
.dest.pending{border-color:#D9B24C}
.tile{position:relative;width:42px;height:42px;flex:none;display:flex;justify-content:center}
.tile .ext{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.02em}
.th{width:42px;height:42px;flex:none;border-radius:6px;overflow:hidden}
.th.shot{border:1px solid #D6D6D0;background:#fff;display:flex;flex-direction:column}
.th.receipt{background:#E4E1D9;display:flex;align-items:center;justify-content:center}
.th.video{background:#2A2B2E;display:flex;align-items:center;justify-content:center}
.paper{width:24px;height:34px;padding:4px 3px;background:#fff;display:flex;flex-direction:column;gap:3px;transform:rotate(-4deg)}
.stagewrap{overflow-x:auto;border-radius:14px}
.stage{position:relative;width:880px;height:440px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.flyer{position:absolute;width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:fly 700ms cubic-bezier(.45,0,.25,1) both}
.flyer span{max-width:72px;font-size:10px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin{position:absolute;top:316px;height:100px;border-radius:12px;border:2px solid var(--line);background:#FAFAF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 6px;transition:background 150ms,border-color 150ms,transform 150ms}
.bin b{max-width:100%;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin small{font-size:12px;color:var(--muted2)}
.done{position:absolute;left:0;right:0;top:0;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fadein 160ms ease-out both}
.rules{display:flex;flex-wrap:wrap;overflow:hidden}
.rlist{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;padding:12px;border-right:1px solid var(--line2);background:var(--panel)}
.rlist .navbtn.on{background:var(--line2);color:var(--ink)}
.addcat{margin-top:8px;border:1px dashed #C9C9C2;justify-content:flex-start;background:transparent}
.rform{flex:999 1 420px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:500;color:var(--muted2)}
.hint{font-size:12px;color:var(--muted)}
.txt{min-height:44px;padding:0 12px;border:1px solid #D6D6D0;border-radius:8px;font-family:var(--mono);font-size:14px;background:#fff}
.txt.sm{min-height:36px;font-size:13px;padding:0 10px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;padding-left:10px;border-radius:6px;background:var(--line3);font-size:13px}
.chip.mono{font-family:var(--mono)}
.chip button{width:28px;height:28px;border:0;border-radius:6px;background:transparent;font-size:15px;cursor:pointer}
.chip button:hover{background:rgba(20,20,19,.08)}
.hist{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px}
.hist .bar{flex:1 1 200px;height:10px}
.backdrop{position:fixed;inset:0;border:0;padding:0;background:rgba(20,20,19,.28);cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:#fff;box-shadow:-8px 0 32px rgba(20,20,19,.16);display:flex;flex-direction:column;animation:slidein 160ms ease-out both}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 12px 16px 24px;border-bottom:1px solid var(--line2)}
.dbody{flex:1 1 auto;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.big{height:300px;flex:none;border-radius:12px;background:var(--line3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.decide{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line2)}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:13px}
dt{color:var(--muted)}dd{margin:0}
.dfoot{display:flex;gap:8px;padding:12px 24px 20px;border-top:1px solid var(--line2)}
.dfoot .btn{flex:1}
.kbd{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:0 24px 12px}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}55%{transform:translate(calc(var(--dx) * .55),calc(var(--dy) * .55 - 70px)) scale(1.08) rotate(-6deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flyer{animation-duration:1ms}.page,.drawer,.done{animation:none}}
</style>
</head>

  }).join('');
  var done = S.phase === 'done' ? '<div class="done"><span style="color:#0A6E64;display:flex">' + svg(I.check, 48, ' stroke-width="2"') + '</span><span style="font-size:18px;font-weight:700">已整理 ' + S.lastCount + ' 個檔案</span>' +
    '<div class="actions"><button class="btn" data-act="undoLast">復原這次</button><button class="btn" data-act="nav" data-to="history">查看紀錄</button><button class="btn primary" data-act="again">再整理一個</button></div></div>' : '';
  return '<section class="page"><div><h1>' + (flying ? '整理中…' : '整理完成') + '</h1><p class="sub">' + (flying ? '檔案正在搬進各資料夾' : '所有搬移都記在「紀錄」，隨時可以復原') + '</p></div>' +
    '<div class="stagewrap"><div class="stage">' + flyers + bins + done + '</div></div></section>';
}
function viewRules() {
  var cc = folder(S.selCat) || S.folders[0]; var r = S.rules[cc.id]; var locked = S.folders.length <= 1;
  var list = S.folders.map(function (c) { return '<button class="navbtn' + (c.id === cc.id ? ' on' : '') + '" data-act="pickCat" data-id="' + c.id + '"><span class="sw" style="width:12px;height:12px;background:' + c.color + '"></span>' + esc(c.name) + '</button>'; }).join('');
  var exts = r.exts.map(function (v) { return '<span class="chip mono" style="background:' + cc.soft + ';color:' + cc.color + '">.' + esc(v) + '<button data-act="rmExt" data-v="' + esc(v) + '" aria-label="移除 ' + esc(v) + '">×</button></span>'; }).join('');
  var kws = r.keywords.length ? r.keywords.map(function (v) { return '<span class="chip">' + esc(v) + '<button data-act="rmKw" data-v="' + esc(v) + '" aria-label="移除 ' + esc(v) + '">×</button></span>'; }).join('') : '<span style="font-size:13px;color:var(--muted)">沒有關鍵字規則</span>';
  var dateOpts = [['any', '不限'], ['week', '一週內'], ['month', '一個月內'], ['year', '超過一年']].map(function (o) { return '<option value="' + o[0] + '"' + (r.date === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
  var ex = S.excluded.map(function (v) { return '<span class="chip mono">' + esc(v) + '<button data-act="rmEx" data-v="' + esc(v) + '" aria-label="移除 ' + esc(v) + '">×</button></span>'; }).join('');
  return '<section class="page"><div><h1>分類設定</h1><p class="sub">規則由上到下比對；規則都抓不到的檔案，才會交給 AI 建議。</p></div>' +
    '<div class="panel rules"><div class="rlist">' + list + '<button class="btn addcat" data-act="addCat">' + svg(I.plus, 14) + '新增分類</button></div>' +
    '<div class="rform"><div style="display:flex;align-items:center;gap:10px"><span class="sw" style="width:14px;height:14px;border-radius:4px;background:' + cc.color + '"></span><h2 style="font-size:20px">' + esc(cc.name) + '</h2></div>' +
    '<div class="field"><label for="folder">目標資料夾</label><input id="folder" class="txt" data-change="folder" value="' + esc(r.folder) + '"><span class="hint">可用 {年}-{月} 依修改日期分子資料夾；在預覽畫面改資料夾名稱，這裡也會跟著改</span></div>' +
    '<div class="field"><span class="lbl">副檔名</span><div class="chips">' + exts + '<input class="txt sm" style="width:150px" data-input="draftExt" value="' + esc(S.draftExt) + '" aria-label="新增副檔名" placeholder="新增，例如 heic"><button class="btn sm" data-act="addExt">加入</button></div></div>' +
    '<div class="field"><span class="lbl">檔名包含</span><div class="chips">' + kws + '</div></div>' +
    '<div class="field"><label for="date">修改日期</label><select id="date" class="txt" style="max-width:240px;font-family:inherit" data-change="date">' + dateOpts + '</select></div>' +
    '<div style="display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--line2)"><button class="btn" style="color:var(--red)" data-act="removeCat"' + (locked ? ' disabled title="至少要保留一個分類"' : '') + '>刪除分類</button></div></div></div>' +
    '<div class="panel" style="display:flex;flex-direction:column;gap:10px;padding:20px"><div style="display:flex;align-items:center;gap:10px"><span style="color:var(--muted2);display:flex">' + svg(I.lock) + '</span><h2 style="font-size:16px">不送給 AI</h2></div>' +
    '<p style="font-size:13px;color:var(--muted)">這些資料夾與副檔名只用規則分類，檔名與內容都不會送出。</p>' +
    '<div class="chips">' + ex + '<input class="txt sm" style="width:190px" data-input="draftEx" value="' + esc(S.draftEx) + '" aria-label="新增排除項目" placeholder="資料夾或 *.副檔名"><button class="btn sm" data-act="addEx">加入</button></div></div></section>';
}
function viewHistory() {
  var rows = S.history.map(function (h) {
    var segs = h.segs.map(function (s) { return '<div style="width:' + s.pct + '%;background:' + s.color + '"></div>'; }).join('');
    return '<div class="panel hist" style="opacity:' + (h.undone ? .6 : 1) + '"><div style="display:flex;flex-direction:column;gap:4px;min-width:160px"><span style="font-size:15px;font-weight:700">' + esc(h.source) + ' · ' + h.count + ' 個檔案</span><span style="font-size:12px;color:var(--muted)">' + esc(h.when) + (h.undone ? ' · 已復原' : '') + '</span></div>' +
      '<div class="bar" role="img" aria-label="這次整理的分類比例">' + segs + '</div>' +
      '<button class="btn" data-act="undo" data-id="' + h.id + '"' + (h.undone ? ' disabled' : '') + '>' + svg(I.undo, 16) + (h.undone ? '已復原' : '復原') + '</button></div>';
  }).join('');
  return '<section class="page"><div><h1>紀錄</h1><p class="sub">每次整理都會記下來，可以一鍵把檔案搬回原位。</p></div><div style="display:flex;flex-direction:column;gap:10px">' + rows + '</div></section>';
}
function bigPreview(f, c) {
  if (f.pv === 'shot') return '<div style="width:400px;max-width:92%;height:250px;border-radius:8px;border:1px solid #D6D6D0;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 16px rgba(20,20,19,.10)">' +
    '<div style="height:26px;flex:none;background:#ECECE8;display:flex;align-items:center;gap:6px;padding:0 10px"><span style="width:9px;height:9px;border-radius:50%;background:#C9C9C2"></span><span style="width:9px;height:9px;border-radius:50%;background:#C9C9C2"></span><span style="width:9px;height:9px;border-radius:50%;background:#C9C9C2"></span><span style="margin-left:12px;height:10px;width:140px;border-radius:5px;background:#fff"></span></div>' +
    '<div style="flex:1;display:flex;gap:12px;padding:12px"><div style="width:80px;display:flex;flex-direction:column;gap:8px"><span style="height:10px;border-radius:3px;background:' + c.soft + '"></span><span style="height:10px;width:70%;border-radius:3px;background:#ECECE8"></span><span style="height:10px;width:85%;border-radius:3px;background:#ECECE8"></span><span style="height:10px;width:60%;border-radius:3px;background:#ECECE8"></span></div>' +
    '<div style="flex:1;display:flex;flex-direction:column;gap:10px"><span style="height:16px;width:60%;border-radius:4px;background:#D6D6D0"></span><span style="height:8px;border-radius:4px;background:#ECECE8"></span><span style="height:8px;width:90%;border-radius:4px;background:#ECECE8"></span><div style="flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><span style="border-radius:6px;background:' + c.soft + '"></span><span style="border-radius:6px;background:#ECECE8"></span><span style="border-radius:6px;background:#ECECE8"></span></div></div></div></div>';
  if (f.pv === 'receipt') return '<div style="position:absolute;inset:0;background:#E4E1D9"></div><div style="position:relative;width:200px;height:270px;padding:18px 16px;background:#fff;box-shadow:0 6px 18px rgba(20,20,19,.18);transform:rotate(-3deg);display:flex;flex-direction:column;gap:8px;font-size:11px;color:#44474C">' +
    '<span style="font-size:14px;font-weight:700;text-align:center;color:var(--ink)">電子發票證明聯</span><span style="text-align:center">[日期]</span><span style="text-align:center;font-family:var(--mono);font-weight:500;color:var(--ink)">[發票號碼]</span><span style="height:1px;background:#D6D6D0"></span>' +
    '<span style="display:flex;justify-content:space-between"><span>[品項]</span><span>[金額]</span></span><span style="display:flex;justify-content:space-between"><span>[品項]</span><span>[金額]</span></span><span style="display:flex;justify-content:space-between"><span>[品項]</span><span>[金額]</span></span>' +
    '<span style="margin-top:auto;height:1px;background:#D6D6D0"></span><span style="display:flex;justify-content:space-between;font-weight:700;color:var(--ink)"><span>總計</span><span>[總金額]</span></span>' +
    '<span style="height:22px;background:repeating-linear-gradient(90deg,#1C1D1F 0 2px,transparent 2px 4px,#1C1D1F 4px 5px,transparent 5px 8px)"></span></div>';
  if (f.pv === 'doc') return '<div style="width:230px;height:270px;padding:22px 20px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(20,20,19,.08);display:flex;flex-direction:column;gap:10px;overflow:hidden"><span style="font-size:9px;font-weight:700;letter-spacing:.06em;color:' + c.color + '">' + esc(f.ext) + ' · 第 1 頁</span><span style="font-size:12px;line-height:1.7;white-space:pre-line">' + esc(f.excerpt || '') + '</span></div>';
  if (f.pv === 'video') return '<div style="position:absolute;inset:0;background:#2A2B2E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><span style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#fff"></path></svg></span><span style="font-size:13px;color:#D6D6D0">第一格畫面 · 長度 [mm:ss]</span></div>';
  if (f.pv === 'pkg') return '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;text-align:center"><span style="color:' + c.color + ';display:flex">' + svg(I.pkg, 64, ' stroke-width="1.5"') + '</span><span style="font-size:14px;font-weight:700">磁碟映像檔</span><span style="font-size:13px;color:var(--muted)">內容需要掛載後才看得到，這裡只顯示檔案資訊</span></div>';
  return '<div style="width:100%;height:100%;padding:20px;display:flex;flex-direction:column;gap:10px"><span style="font-size:13px;color:var(--muted2)">無法辨識格式，顯示前 64 bytes</span><span style="font-family:var(--mono);font-size:12px;line-height:1.8;white-space:pre">' + esc(HEX) + '</span></div>';
}
function viewDrawer() {
  var f = fileById(S.previewId); if (!f || S.screen !== 'preview') return '';
  var order = folderOrder(); var ix = order.indexOf(f); var d = dest(f); var c = colorOf(f);
  var path = sourceObj().path.replace(/\/?$/, '/') + f.name;
  return '<button class="backdrop" data-act="closePv" aria-label="關閉預覽" tabindex="-1"></button>' +
    '<aside class="drawer" role="dialog" aria-label="檔案預覽">' +
    '<div class="dhead"><div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px"><h2 style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(f.name) + '</h2><span style="font-size:12px;color:var(--muted)">' + (ix + 1) + ' / ' + order.length + '</span></div>' +
    '<button class="icon" data-act="closePv" aria-label="關閉">' + svg(I.close, 18, ' stroke-width="2"') + '</button></div>' +
    '<div class="dbody"><div class="big">' + bigPreview(f, c) + '</div>' +
    '<div class="decide"><label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer"><input type="checkbox" class="cb" data-change="check" data-id="' + f.id + '"' + (S.checked[f.id] ? ' checked' : '') + (d ? '' : ' disabled') + '>搬移這個檔案</label>' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><label for="pvdest" style="font-size:13px;color:var(--muted2)">目的地</label>' + destSelect(f, c, 'pvdest', '', 'flex:1 1 180px;max-width:none;min-height:40px') + '</div>' +
    '<span style="font-family:var(--mono);font-size:12px;color:var(--muted)">→ ' + esc(targetPath(f)) + '</span></div>' +
    '<dl><dt>大小</dt><dd>' + esc(f.size) + '</dd><dt>修改日期</dt><dd>' + esc(f.date) + '</dd><dt>位置</dt><dd style="font-family:var(--mono);font-size:12px;word-break:break-all">' + esc(path) + '</dd><dt>判斷依據</dt><dd>' + esc(S.manual[f.id] ? '手動指定' : f.why) + '</dd></dl></div>' +
    '<div class="dfoot"><button class="btn" data-act="pvStep" data-dir="-1"' + (ix <= 0 ? ' disabled' : '') + '>' + svg(I.left, 16, ' stroke-width="2"') + '上一個</button><button class="btn" data-act="pvStep" data-dir="1"' + (ix >= order.length - 1 ? ' disabled' : '') + '>下一個' + svg(I.right, 16, ' stroke-width="2"') + '</button></div>' +
    '<div class="kbd">← → 切換 · Esc 關閉</div></aside>';
}

var VIEWS = { source: viewSource, preview: viewPreview, stage: viewStage, rules: viewRules, history: viewHistory };
var app = document.getElementById('app');
function render() {
  app.innerHTML = '<div class="shell">' + viewNav() + '<main>' + VIEWS[S.screen]() + '</main>' + viewDrawer() + '</div>';
  var af = app.querySelector('[data-autofocus]');
  if (af) { af.focus(); af.select(); }
}

// ---------- events (delegated) ----------
app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var fn = ACT[t.dataset.act]; if (fn) fn(t.dataset, e);
});
app.addEventListener('change', function (e) {
  var t = e.target; var k = t.dataset.change; if (!k) return;
  if (k === 'check') toggleFile(+t.dataset.id);
  else if (k === 'dest') reassignFile(+t.dataset.id, t.value);
  else if (k === 'folder') { S.rules[S.selCat].folder = t.value; render(); }
  else if (k === 'date') { S.rules[S.selCat].date = t.value; render(); }
});
app.addEventListener('input', function (e) { var k = e.target.dataset.input; if (k) S[k] = e.target.value; });
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.key === 'rename') {
    if (e.key === 'Enter') { e.preventDefault(); commitName(); } else if (e.key === 'Escape') { set({ editing: null }); }
    return;
  }
  if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
  if (S.previewId != null && S.screen === 'preview') {
    if (e.key === 'Escape') set({ previewId: null });
    else if (e.key === 'ArrowLeft') stepPreview(-1);
    else if (e.key === 'ArrowRight') stepPreview(1);
  }
});
render();
</script>
</body>
</html>
